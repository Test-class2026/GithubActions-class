name: Build and Deploy with Helm
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/interswitch-portal

permissions:
  contents: write 
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
 
      - name: Derive an image tag from the commit SHA
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build the image (not pushed yet)
        run: docker build -t $IMAGE:$TAG -t $IMAGE:latest .
 
      - name: Scan the repository for committed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
 
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          scan-type: image
          severity: 
          ignore-unfixed: true
          exit-code: '0'
 
      - name: Push the image
        run: |
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Record the new image tag in Git
        run: |
          yq -i ".portal.image.tag = \"$TAG\"" chart/values.yaml
 
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): portal $TAG [skip ci]"
          git push
