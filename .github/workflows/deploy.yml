name: Build and Deploy with Helm
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/interswitch-portal
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
 
      - name: Derive an image tag from the commit SHA
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build the image (not pushed yet)
        run: docker build -t $IMAGE:$TAG -t $IMAGE:latest .
 
      - name: Scan the repository for committed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
 
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          scan-type: image
          severity: 
          ignore-unfixed: true
          exit-code: '0'
 
      - name: Push the image
        run: |
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
 
      - name: Write the kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
 
      - name: Install Helm
        uses: azure/setup-helm@v4
 
      - name: Work out the cluster address
        run: |
          NODE_IP=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' \
            | sed -E 's#https://([^:]+):.*#\1#')
          echo "NODE_IP=$NODE_IP" >> $GITHUB_ENV
          echo "Deploying to $NODE_IP"
          
      - name: Create the Kubernetes Secret from AWS Secrets Manager
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          aws secretsmanager get-secret-value \
            --secret-id interswitch/portal \
            --query SecretString --output text > /tmp/secret.json
 
          kubectl create secret generic portal-secrets \
            --from-env-file=<(jq -r 'to_entries|.[]|"\(.key)=\(.value)"' /tmp/secret.json) \
            --dry-run=client -o yaml | kubectl apply -f -
 
          rm -f /tmp/secret.json
          kubectl get secret portal-secrets
 
      - name: Deploy
        run: |
          helm upgrade --install interswitch ./chart \
            --set portal.image.repository=$IMAGE \
            --set portal.image.tag=$TAG \
            --set ingress.host=portal.$NODE_IP.nip.io \
            --atomic --wait --timeout 5m
 
      - name: Show what is running
        run: |
          helm history interswitch
          kubectl get pods
