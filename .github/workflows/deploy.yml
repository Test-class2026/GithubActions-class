name: Interswitch Portal — CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    branches:
      - main    

jobs:

  # ================================================
  # JOB 1: Validate files before any deployment
  # ================================================
  validate:
    name: Validate Web Files
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show file structure
        run: |
          echo '=== Repository structure ==='
          ls -la
          echo '=== Web directory ==='
          ls -la web/

      - name: Check web directory exists
        run: |
          if [ ! -d 'web' ]; then
            echo 'ERROR: web/ directory not found'
            exit 1
          fi
          echo 'OK: web/ directory found'

      - name: Check index.html exists and is not empty
        run: |
          if [ ! -f 'web/index.html' ]; then
            echo 'ERROR: web/index.html not found'
            exit 1
          fi
          if [ ! -s 'web/index.html' ]; then
            echo 'ERROR: web/index.html is empty'
            exit 1
          fi
          echo 'OK: web/index.html found and is not empty'

      - name: Check style.css exists and is not empty
        run: |
          if [ ! -f 'web/style.css' ]; then
            echo 'ERROR: web/style.css not found'
            exit 1
          fi
          if [ ! -s 'web/style.css' ]; then
            echo 'ERROR: web/style.css is empty'
            exit 1
          fi
          echo 'OK: web/style.css found and is not empty'

      - name: Validation summary
        run: |
          echo '================================================'
          echo 'All validation checks passed. Safe to deploy.'
          echo '================================================'
          # ================================================
  # JOB 2: Deploy to EC2 after validation passes
  # ================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: validate    # Only runs if validate passed

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy web files to EC2
        run: |
          echo 'Copying files to EC2...'
          scp -i ~/.ssh/deploy_key -r web/* \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/interswitch_web/

      - name: Install files to Nginx web root
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'sudo mkdir -p /usr/share/nginx/html && \
             sudo cp /tmp/interswitch_web/* /usr/share/nginx/html/ && \
             sudo chown -R www-data:www-data /usr/share/nginx/html/ && \
             sudo chmod -R 755 /usr/share/nginx/html/'

      - name: Verify Nginx is still running
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'sudo systemctl status nginx --no-pager'

      - name: Write deployment log entry
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "echo '[$(date)] Deployed ${{ github.sha }}' \
             | sudo tee -a /var/log/interswitch_deployments.log"

      - name: Deployment complete
        run: |
          echo '================================================'
          echo 'Deployment complete!'
          echo "Live at: http://${{ secrets.EC2_HOST }}"
          echo '================================================'
           # ================================================
  # JOB 3: Verify site is live after deployment
  # ================================================
  health_check:
    name: Verify Site is Live
    runs-on: ubuntu-latest
    needs: deploy    # Only runs after deploy succeeds

    steps:

      - name: Wait for site to be ready
        run: sleep 5

      - name: Check site responds with HTTP 200
        run: |
          echo 'Checking site health...'
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://${{ secrets.EC2_HOST }})
          echo "HTTP response code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo 'HEALTH CHECK PASSED: Site is responding with HTTP 200'
          else
            echo "HEALTH CHECK FAILED: Site returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Health check summary
        run: |
          echo '================================================'
          echo 'All health checks passed.'
          echo "Live site: http://${{ secrets.EC2_HOST }}"
          echo '================================================'