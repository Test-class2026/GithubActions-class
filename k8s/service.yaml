apiVersion: v1
kind: Service
metadata:
  name: portal               # Becomes the DNS name inside the cluster
spec:
  type: NodePort             # Opens a port on the node itself
  selector:
    app: portal              # Sends traffic to every Pod with this label
  ports:
    - port: 3000             # Port the Service listens on inside the cluster
      targetPort: 3000       # Port on the container
      nodePort: 30080        # Port on the node (allowed range 30000-32767)