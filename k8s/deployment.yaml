apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # never drop below 2 running Pods
      maxSurge: 1              # add one spare while updating
  minReadySeconds: 5
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
        - name: portal
          image: felixanxy/interswitch-portal:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: '3000'
          envFrom:
            - configMapRef:
                name: portal-config
            - secretRef:
                name: portal-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:      # gate traffic until the app answers
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:       # restart it if it wedges later
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portal-data